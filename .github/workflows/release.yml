name: Android APK release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.ref_name, '-preview') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - run: npx expo-doctor
      - run: npm run export:web
      - name: Подготовить Android-проект и ключ подписи
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          npx expo prebuild --platform android --no-install
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/debug.keystore
      - name: Собрать подписанный release APK
        env:
          NODE_ENV: production
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk preflop-trainer.apk
      - name: Вычислить SHA-256
        run: |
          sha256sum preflop-trainer.apk > preflop-trainer.apk.sha256
      - name: Опубликовать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" preflop-trainer.apk preflop-trainer.apk.sha256 \
            --title "Preflop Trainer ${GITHUB_REF_NAME}" \
            --generate-notes
